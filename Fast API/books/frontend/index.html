<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book inventory management dashboard" />
    <title>Bookstock | Library Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="container-xxl d-flex align-items-center justify-content-between gap-3">
          <a class="brand" href="/" aria-label="Bookstock home">
            <span class="brand-mark"><i class="bi bi-book-half"></i></span>
            <span>bookstock</span>
          </a>
          <div class="d-flex align-items-center gap-3">
            <span class="sync-status" id="syncStatus">
              <span class="status-dot"></span>Inventory synced
            </span>
            <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">API docs <i class="bi bi-arrow-up-right"></i></a>
          </div>
        </div>
      </header>

      <main class="container-xxl py-4 py-lg-5">
        <section class="page-heading">
          <div>
            <p class="eyebrow">Library inventory</p>
            <h1>Your book collection, at a glance.</h1>
            <p class="lede">Keep track of titles, quantities, and the value of your shelf.</p>
          </div>
          <img
            class="shelf-photo"
            src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=360&q=80"
            alt="Books arranged on a library shelf"
          />
        </section>

        <section class="workspace">
          <div class="inventory-panel">
            <div class="panel-heading">
              <div>
                <h2>Inventory</h2>
                <p id="resultCount">Loading books...</p>
              </div>
              <button class="btn btn-dark add-mobile" type="button" id="focusAddButton">
                <i class="bi bi-plus-lg"></i><span>Add book</span>
              </button>
            </div>

            <div class="toolbar">
              <label class="search-box" for="searchInput">
                <i class="bi bi-search"></i>
                <input id="searchInput" type="search" placeholder="Search title or author" autocomplete="off" />
              </label>
              <select id="categoryFilter" class="form-select" aria-label="Filter by category">
                <option value="">All categories</option>
              </select>
              <select id="sortBy" class="form-select" aria-label="Sort books">
                <option value="title">Sort: Title</option>
                <option value="author">Sort: Author</option>
                <option value="quantity">Sort: Stock</option>
                <option value="price">Sort: Price</option>
              </select>
            </div>

            <div class="book-list" id="bookList" aria-live="polite"></div>
            <div class="empty-state d-none" id="emptyState">
              <i class="bi bi-journal-x"></i>
              <h3>No matching books</h3>
              <p>Try another search or add a new title.</p>
            </div>
          </div>

          <aside class="editor-panel" id="bookEditor">
            <div class="editor-heading">
              <div>
                <p class="eyebrow" id="formEyebrow">New title</p>
                <h2 id="formTitle">Add a book</h2>
              </div>
              <button class="icon-button d-none" id="cancelEditButton" type="button" aria-label="Cancel editing" title="Cancel editing">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
            <form id="bookForm" novalidate>
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input id="title" class="form-control" name="title" required maxlength="255" />
              </div>
              <div class="mb-3">
                <label for="author" class="form-label">Author</label>
                <input id="author" class="form-control" name="author" required maxlength="255" />
              </div>
              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <input id="category" class="form-control" name="category" list="categoryOptions" required maxlength="100" placeholder="e.g. Fiction" />
                <datalist id="categoryOptions"></datalist>
              </div>
              <div class="row g-3 mb-4">
                <div class="col-7">
                  <label for="price" class="form-label">Price</label>
                  <div class="input-group"><span class="input-group-text">₹</span><input id="price" class="form-control" name="price" type="number" min="1" step="0.01" required /></div>
                </div>
                <div class="col-5">
                  <label for="quantity" class="form-label">Quantity</label>
                  <input id="quantity" class="form-control" name="quantity" type="number" min="0" step="1" required />
                </div>
              </div>
              <div class="form-error d-none" id="formError" role="alert"></div>
              <button class="btn btn-primary w-100" id="submitButton" type="submit">
                <i class="bi bi-plus-lg"></i><span>Add to inventory</span>
              </button>
            </form>
          </aside>
        </section>
      </main>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="messageToast" class="toast border-0" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex"><div class="toast-body" id="toastMessage"></div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
